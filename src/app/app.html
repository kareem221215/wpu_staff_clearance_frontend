<p-toast position="top-left" class="top-20!" />
<p-confirmpopup />

<div class="flex flex-col min-h-screen gap-8 sm:gap-16 w-full">
  <header
    class="print:hidden sticky z-2 top-0 bg-white/95 border-b-2 border-surface shadow-sm p-4 flex gap-4 items-center justify-between"
  >
    <a
      routerLink="/"
      class="flex items-center gap-3 shrink-0 no-underline text-2xl drop-shadow-sm font-bold tracking-tight text-primary"
    >
      <img src="watania-logo.svg" class="h-12 w-12 object-contain" />
      نظام براءة ذمة الموظف
      <span class="hidden lg:inline">- الجامعة الوطنية الخاصة</span>
    </a>

    <div class="flex items-center gap-3 shrink-0">
      @if (isAuthed()) {
        <a pButton rounded [href]="getAuthHref(false)" (click)="logout()">
          <span class="hidden sm:block">تسجيل خروج</span>
          <svg data-p-icon="sign-out" class="h-6"></svg>
        </a>
      } @else {
        <a pButton rounded [href]="getAuthHref(true)">
          <svg data-p-icon="sign-in" class="h-6"></svg>
          <span class="hidden sm:block">تسجيل الدخول</span>
        </a>
      }
    </div>
  </header>

  <main class="flex flex-col justify-start max-w-300 w-full px-4 grow mx-auto">
    <router-outlet class="hidden" />
  </main>

  <footer class="print:hidden flex flex-col justify-center text-white p-12 gap-12">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-12">
      <div class="flex flex-col gap-3">
        <div class="flex items-center gap-2">
          <svg data-p-icon="book" class="text-surface-500" [size]="24"></svg>
          <span class="font-medium text-2xl">نظام براءة ذمة الموظف</span>
        </div>
        <p class="text-muted-color text-sm leading-relaxed">الجامعة الوطنية الخاصة</p>
        <div class="flex gap-4 social-links">
          <a target="_blank" href="https://x.com/AlUniversty">
            <svg data-p-icon="twitter"></svg>
          </a>
          <a target="_blank" href="https://www.instagram.com/wataniyapu">
            <svg data-p-icon="instagram"></svg>
          </a>
          <a
            target="_blank"
            href="https://www.linkedin.com/in/al-wataniya-private-university-wpu-a11244384"
          >
            <svg data-p-icon="linkedin"></svg>
          </a>
          <a target="_blank" href="https://www.facebook.com/AlWataniya.Private.University">
            <svg data-p-icon="facebook"></svg>
          </a>
          <a
            target="_blank"
            href="https://youtube.com/channel/UCHmFO72wWNaaaI08gYPxgMQ?si=piCyxlzXXqB4XLzK"
          >
            <svg data-p-icon="youtube"></svg>
          </a>
        </div>
      </div>

      <div class="flex flex-col gap-3">
        <div class="flex items-center gap-2">
          <svg data-p-icon="external-link" class="text-surface-500" [size]="24"></svg>
          <span class="font-medium text-2xl"> روابط سريعة </span>
        </div>
        <ul class="space-y-2 text-muted-color text-sm">
          <li>
            <a
              routerLink="/requests"
              class="hover:text-surface-500 transition inline-flex items-center gap-2"
            >
              <svg data-p-icon="angle-left"></svg> الطلبات
            </a>
          </li>
          <li>
            <a
              routerLink="/stats"
              class="hover:text-surface-500 transition inline-flex items-center gap-2"
            >
              <svg data-p-icon="angle-left"></svg> احصائيات
            </a>
          </li>
          <!-- <a
          (click)="openPoliciesDialog()"
          class="hover:text-surface-500 transition inline-flex items-center gap-2 cursor-pointer"
          ><svg data-p-icon="angle-left"></i> سياسة المكتبة<svga
        > -->
        </ul>
      </div>
    </div>

    <div class="flex flex-col gap-2 text-center text-muted-color text-sm">
      <hr />
      <p>© 2026 الجامعة الوطنية الخاصة - فريق تكنولوجيا المعلومات و الاتصالات</p>
    </div>
  </footer>
</div>
