<app-approval-list [approvals]="displayApprovals()" [loading]="loading()" />

<ng-template #toolbarTpl>
  @if (canCreate()) {
    <button
      (click)="startProcess()"
      [disabled]="creating()"
      [loading]="creating()"
      pButton
      severity="secondary"
      size="small"
    >
      <svg data-p-icon="send"></svg>
      انشاء طلب
    </button>
  }
</ng-template>
