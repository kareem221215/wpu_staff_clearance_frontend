<p-table
  (onLazyLoad)="onLazyLoad($event)"
  [first]="searchModel().skip"
  [loading]="loading()"
  [rows]="pageSize"
  [totalRecords]="staff().total"
  [value]="staff().data"
  class="min-h-166"
  dataKey="staffId"
  lazy
  paginator
>
  <ng-template #emptymessage>
    <tr>
      <td colspan="7" class="text-center">لم يتم العثور على أي مدير.</td>
    </tr>
  </ng-template>

  <ng-template #header>
    <tr>
      <th>
        <div class="flex items-center gap-2">
          <svg data-p-icon="user"></svg>
          <span>المدير</span>
        </div>
      </th>

      <th>
        <div class="flex items-center gap-2">
          <svg data-p-icon="building"></svg>
          <span>الكلية</span>
        </div>
      </th>

      <th class="text-center w-1">
        <svg data-p-icon="bolt"></svg>
      </th>
    </tr>
  </ng-template>

  <ng-template #body let-manager>
    <tr>
      <td>{{ manager.name }}</td>
      <td>{{ manager.collegeName }}</td>

      <td class="text-center">
        @if (getApproval(manager); as approval) {
          @if (approval.approved) {
            <svg data-p-icon="check"></svg>
          } @else {
            <svg data-p-icon="times"></svg>
          }
        } @else {
          <svg data-p-icon="spinner" [spin]="creating()" [size]="24"></svg>
        }
      </td>
    </tr>
  </ng-template>
</p-table>

<ng-template #toolbarTpl>
  <button (click)="startProcess()" pButton severity="secondary" size="small">
    <svg data-p-icon="send"></svg>
    انشاء طلب
  </button>
</ng-template>
