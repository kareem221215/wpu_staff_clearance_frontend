<div class="flex flex-col xl:flex-row gap-2 text-white font-medium text-shadow-md">
  <a class="stats-card" routerLink="/request/list">
    <svg data-p-icon="file" [size]="40"></svg>
    <ng-container
      *ngTemplateOutlet="
        numTpl;
        context: { $implicit: stats().requestCount, label: 'اجمالي الطلبات' }
      "
    />
  </a>
  <a class="stats-card" routerLink="/request/list" [queryParams]="{ archived: true }">
    <svg data-p-icon="ban" [size]="40"></svg>
    <ng-container
      *ngTemplateOutlet="
        numTpl;
        context: {
          $implicit: stats().archivedRequestCount,
          label: 'الطلبات المؤرشفة',
        }
      "
    />
  </a>
  <a
    class="stats-card bg-red-600/20"
    routerLink="/request/list"
    [queryParams]="{ incompleted: false }"
  >
    <svg data-p-icon="ban" [size]="40"></svg>
    <ng-container
      *ngTemplateOutlet="
        numTpl;
        context: {
          $implicit: stats().requestCount - stats().completedRequestCount,
          label: 'الطلبات غير المكتملة',
        }
      "
    />
  </a>
  <a
    class="stats-card bg-green-800/20"
    routerLink="/request/list"
    [queryParams]="{ completed: true }"
  >
    <svg data-p-icon="folder" [size]="40"></svg>
    <ng-container
      *ngTemplateOutlet="
        numTpl;
        context: {
          $implicit: stats().completedRequestCount,
          label: 'الطلبات المكتملة',
        }
      "
    />
  </a>
</div>

<ng-template #numTpl let-num let-label="label">
  <span>{{ label }}</span>
  @if (loading()) {
    <svg data-p-icon="spinner" [spin]="true" class="h-6"></svg>
  } @else {
    <span>{{ num }}</span>
  }
</ng-template>
