<p-table [loading]="loading()" [value]="approvals()" class="min-h-fit" dataKey="requestApprovalId">
  <ng-template #emptymessage>
    <tr>
      <td colspan="3" class="text-center">لا يوجد مسؤولون بعد.</td>
    </tr>
  </ng-template>

  <ng-template #header>
    <tr>
      <th>
        <div class="flex items-center gap-2">
          <svg data-p-icon="user"></svg>
          <span>المدير</span>
        </div>
      </th>

      <th>
        <div class="flex items-center gap-2">
          <svg data-p-icon="building"></svg>
          <span>الكلية</span>
        </div>
      </th>

      <th class="text-center">
        <div class="flex items-center justify-center gap-2">
          <svg data-p-icon="bolt"></svg>
          <span>الحالة</span>
        </div>
      </th>
    </tr>
  </ng-template>

  <ng-template #body let-approval>
    <tr>
      <td>{{ approval.staffName }}</td>
      <td>{{ approval.departmentName }}</td>

      <td class="text-center">
        @if (approval.status === RequestApprovalStatusEnum.APPROVED) {
          <div class="flex items-center justify-center gap-1">
            <svg data-p-icon="check" class="text-green-700" [size]="18"></svg>
            <span class="text-green-700 font-medium">تمت الموافقة</span>
          </div>
        } @else if (approval.status === RequestApprovalStatusEnum.REJECTED) {
          <div class="flex items-center justify-center gap-1">
            @if (approval.note) {
              <svg
                data-p-icon="info-circle"
                class="text-zinc-500 cursor-help"
                [size]="18"
                [pTooltip]="approval.note"
                tooltipPosition="top"
              ></svg>
            }
            <span class="text-red-600 font-medium">تم الرفض</span>
          </div>
        } @else {
          <div class="flex items-center justify-center">
            <svg data-p-icon="spinner" [spin]="true" [size]="24"></svg>
          </div>
        }
      </td>
    </tr>
  </ng-template>
</p-table>
